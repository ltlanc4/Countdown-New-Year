<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <title>Đếm ngược Tết Nguyên Đán 2025</title>
</head>

<body>
    <canvas id="fireworksCanvas"></canvas>
    <div class="text">
        <h1 class="tet2025txt" style="opacity: 0;">2025</h1>
        <p class="chucmungnammoiTxt" style="opacity: 0;">Chúc Mừng Năm Mới!</p>
    </div>
    <ul id="countdown">
        <li id="days">
            <div class="number">00</div>
            <div class="label">Ngày</div>
        </li>
        <li id="hours">
            <div class="number">00</div>
            <div class="label">Giờ</div>
        </li>
        <li id="minutes">
            <div class="number">00</div>
            <div class="label">Phút</div>
        </li>
        <li id="seconds">
            <div class="number">00</div>
            <div class="label">Giây</div>
        </li>
    </ul>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.3/jquery.easing.min.js"></script>
    <script src="../js/countdown.js"></script>
    <script src="../js/firework.js"></script>
</body>

</html>
